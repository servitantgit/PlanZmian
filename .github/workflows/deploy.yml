name: Deploy legacy redirect to GitHub Pages

# The live app is deployed to Cloudflare Pages (https://planzmian.pages.dev/).
# The old GitHub Pages URL (https://servitantgit.github.io/Graffik/) is kept only
# as a stub that redirects visitors to the new address. GitHub Pages cannot issue
# HTTP 301s, so the stub does a meta-refresh + JS redirect (see redirect/index.html)
# and installs a self-destructing service worker that wipes the stale caches of
# the previous cache-first app on that origin.
on:
  push:
    branches: [main, cloudflare]
    paths:
      - 'redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Prevent overlapping deploys that can leave multiple page artifacts
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Single job uploads ONE artifact named github-pages
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the redirect stub — the app itself lives on Cloudflare Pages
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
