<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3c72">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plan Zmian">
  <title>Plan Zmian - IV brygady</title>

  <!-- STYLE -->
  <!-- CSS modules (v3.8.0 split) -->
  <!-- ?v=4.0.2 — cache-buster: forces a fresh fetch even when a service worker
       serves assets cache-first (local dev keeps the literal __BUILD_ID__ in
       sw.js, so its cache name never changes). Bump when CSS changes. -->
  <link rel="stylesheet" href="css/variables.css?v=4.0.2">
  <link rel="stylesheet" href="css/layout.css?v=4.0.2">
  <link rel="stylesheet" href="css/components.css?v=4.0.2">
  <link rel="stylesheet" href="css/calendar.css?v=4.0.2">
  <link rel="stylesheet" href="css/overtime.css?v=4.0.2">
  <link rel="stylesheet" href="css/views.css?v=4.0.2">
  <link rel="stylesheet" href="css/dashboard.css?v=4.0.2">
  <link rel="stylesheet" href="css/responsive.css?v=4.0.2">
  <link rel="stylesheet" href="css/print.css?v=4.0.2">
  <link rel="stylesheet" href="css/smart-popup.css?v=4.0.2">
  <link rel="stylesheet" href="css/app-shell.css?v=4.0.2">
</head>

<body>

  <div class="container">
    <!-- TOP BAR — account (left) · context (center) · menu (right) -->
    <div class="top-bar">
      <button class="icon-btn" id="userAuthBtn" data-i18n-title="profile" title="Google Drive">👤</button>
      <div class="top-bar-title">
        <h1 class="context-title" id="appContextTitle"></h1>
      </div>
      <button class="icon-btn" id="menuBtn" data-i18n-title="menu" title="Menu">☰</button>
    </div>

    <!-- PRIMARY NAVIGATION (desktop; hidden ≤700px — mobile bottom nav takes over) -->
    <nav class="primary-nav" id="primaryNav" aria-label="Views">
      <button type="button" class="primary-nav-btn" data-view="dashboard" data-i18n="viewDashboard">🏠 Dashboard</button>
      <button type="button" class="primary-nav-btn" data-view="month" data-i18n="viewMonth">📅 Miesiąc</button>
      <button type="button" class="primary-nav-btn" data-view="table" data-i18n="viewTable">📋 Tabela</button>
    </nav>

    <!-- CONTEXT TOOLBAR (brigade + range toggle / period; per-view row visibility) -->
    <div class="context-toolbar" id="contextToolbar" data-view="dashboard">
      <div class="context-row context-row-brigade" id="contextRowBrigade">
        <span class="context-label" id="brigadeContextLabel"></span>
        <div class="shift-buttons" id="shiftBtns">
          <button type="button" class="shift-btn A active" data-shift="A">A</button>
          <button type="button" class="shift-btn B" data-shift="B">B</button>
          <button type="button" class="shift-btn C" data-shift="C">C</button>
          <button type="button" class="shift-btn D" data-shift="D">D</button>
        </div>
        <div class="range-toggle" id="contextRowRange" role="group" aria-label="Month / Year">
          <button type="button" class="range-btn active" data-range="month" data-i18n="rangeMonth">Miesiąc</button>
          <button type="button" class="range-btn" data-range="year" data-i18n="rangeYear">Rok</button>
        </div>
      </div>
      <div class="context-row context-row-date" id="contextRowDate">
        <div class="period-nav">
          <button type="button" class="icon-btn period-btn" id="prevPeriodBtn" data-i18n-title="prevMonth"
            title="Poprzedni miesiąc (←)">‹</button>
          <span class="context-period" id="contextPeriod" aria-live="polite"></span>
          <button type="button" class="icon-btn period-btn" id="nextPeriodBtn" data-i18n-title="nextMonth"
            title="Następny miesiąc (→)">›</button>
        </div>
        <button type="button" class="btn-secondary context-today-btn" id="todayBtn" data-i18n="today">📅 Сьогодні</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardView" class="dashboard"></div>

    <!-- MONTH VIEW -->
    <div id="monthView" style="display:none;">
      <div class="calendar-wrap">
        <div class="calendar" id="calendar"></div>
      </div>
      <div class="legend">
        <span class="lg-R">🌅 R (6-14)</span>
        <span class="lg-P">🌤️ P (14-22)</span>
        <span class="lg-N">🌙 N (22-6)</span>
        <span class="lg-U" data-i18n="legendVacation">🌴 Urlop</span>
      </div>
      <div class="info-panel" id="infoPanel">
        <h3 data-i18n="infoPanelTitle">ℹ️ Wybierz dzień w kalendarzu</h3>
        <p data-i18n="infoPanelHint">Kliknij dowolny dzień, aby zobaczyć szczegóły.</p>
      </div>
    </div>

    <!-- YEAR VIEW -->
    <div id="yearView" class="year-view" style="display:none;"></div>

    <!-- TABLE VIEW -->
    <div id="tableView" class="table-view" style="display:none;"></div>

  </div>

  <!-- SIDE MENU -->
  <div class="side-menu-overlay" id="sideMenuOverlay"></div>
  <div class="side-menu" id="sideMenu" tabindex="-1">
    <h3>
      <span data-i18n="menu">☰ Menu</span>
      <button class="side-menu-close" id="sideMenuClose">×</button>
    </h3>

    <div class="menu-section" id="menuDriveSection">
      <div class="menu-section-title drive-section-title" data-i18n="menuSectionDrive">Google Drive</div>

      <div class="drive-card">
        <!-- Enable / disable Drive backup (visible, no need for Settings) -->
        <button type="button" class="drive-enable-row" id="menuDriveEnable" role="switch" aria-checked="false">
          <span class="de-label" data-i18n="settingsPrivacyDriveEnable">Google Drive backup</span>
          <span class="de-switch" aria-hidden="true"><span class="de-knob"></span></span>
        </button>
        <div class="drive-divider"></div>

        <!-- c) Account block: avatar + "Account" label + email (filled by updateDriveUI) -->
        <div class="drive-account" id="menuDriveAccount" style="display:none;">
          <span class="da-avatar" id="menuDriveAccountAvatar">?</span>
          <span class="da-meta">
            <span class="da-label" data-i18n="driveCardAccountLabel">Konto</span>
            <span class="da-email" id="menuDriveAccountEmail"></span>
          </span>
          <span class="da-role" id="menuDriveAccountAdmin" title="Admin" style="display:none;">👑</span>
        </div>

        <!-- d) Warning indicator (visible when unsynced / remote-newer). Click opens Sync Options panel. -->
        <button type="button" class="drive-warn" id="menuDriveWarn" style="display:none;">
          <span class="dw-icon">⚠️</span>
          <span class="dw-text" id="menuDriveWarnText"></span>
        </button>

        <!-- e0) Sync options button — opens full-screen panel with mode + diff + actions -->
        <button type="button" class="drive-sync-options" id="menuDriveSyncOptions" style="display:none;">
          <span class="mi-icon">⚙️</span>
          <span data-i18n="driveSyncOptionsTitle">Sync options</span>
        </button>

        <!-- e-login) Sign in with Google — shown when Drive is ON and user is not logged in -->
        <button type="button" class="drive-login" id="menuDriveLogin" style="display:none;">
          <span class="mi-icon mi-icon-svg" aria-hidden="true"><svg class="mi-svg" viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span>
          <span data-i18n="menuDriveLogin">Sign in with Google</span>
        </button>

        <!-- e) Logout button (secondary/outline) -->
        <button type="button" class="drive-logout" id="menuDriveLogout" style="display:none;">
          <span class="mi-icon mi-icon-svg"><svg class="mi-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5z"/><path fill="currentColor" d="M4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></span>
          <span data-i18n="menuDriveLogout">Wyloguj z Google Drive</span>
        </button>
      </div>
    </div>

    <!-- ADMIN (admin-only) -->
    <div class="menu-section admin-only">
      <div class="menu-section-title" data-i18n="menuSectionAdmin">👑 Admin Panel</div>
      <button type="button" class="menu-item" id="menuAdminCenter">
        <span class="mi-icon">🛠️</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="adminCenterTitle">Panel administratora</span>
          <span class="mi-desc" data-i18n="adminCenterDesc">Zarządzaj grafikami fabrycznymi i danymi rocznymi</span>
        </span>
      </button>
    </div>


    <!-- 2) SETTINGS -->
    <div class="menu-section">
      <div class="menu-section-title" data-i18n="menuSectionSettings">Ustawienia</div>
      <button type="button" class="menu-item" id="menuSettings">
        <span class="mi-icon">⚙️</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuSettings">Ustawienia</span>
          <span class="mi-desc" data-i18n="menuSettingsDesc">Motyw, język, liczniki i dane</span>
        </span>
      </button>
    </div>

    <!-- 3) TOOLS -->
    <div class="menu-section">
      <div class="menu-section-title" data-i18n="menuSectionTools">Narzędzia</div>
      <button type="button" class="menu-item" id="menuShareCenter">
        <span class="mi-icon">🔗</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuShareCenter">Udostępnij</span>
          <span class="mi-desc" data-i18n="menuShareCenterDesc">Link i kod QR do grafiku</span>
        </span>
      </button>
      <button type="button" class="menu-item" id="menuExportCenter">
        <span class="mi-icon">📤</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuExportCenter">Eksport</span>
          <span class="mi-desc" data-i18n="menuExportCenterDesc">Kalendarz ICS i dane roku</span>
        </span>
      </button>
      <button type="button" class="menu-item" id="menuNotesView">
        <span class="mi-icon">📝</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuNotesView">Notatki</span>
          <span class="mi-desc" data-i18n="menuNotesViewDesc">Wszystkie notatki w jednym miejscu</span>
        </span>
      </button>
      <button type="button" class="menu-item" id="menuInstallApp" style="display:none;">
        <span class="mi-icon">📲</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuInstallApp">Zainstaluj aplikację</span>
        </span>
      </button>
    </div>

    <!-- 4) HELP -->
    <div class="menu-section">
      <div class="menu-section-title" data-i18n="menuSectionInfo">Info</div>
      <button type="button" class="menu-item" id="menuHelp">
        <span class="mi-icon">❓</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuHelp">Pomoc / FAQ</span>
        </span>
      </button>
      <button type="button" class="menu-item" id="menuAbout">
        <span class="mi-icon">ℹ️</span>
        <span class="mi-text">
          <span class="mi-title" data-i18n="menuAbout">O aplikacji</span>
          <span class="mi-desc" data-i18n="menuAboutDesc">Wersja, aktualizacje i pomoc</span>
        </span>
      </button>
    </div>

  </div>

   <!-- FACTORY EDITOR BAR (shown during factory painting mode) -->
  <div id="factoryEditorBar" style="display:none;">
    <div id="factoryEditorContext"></div>
    <div id="factoryEditorTools">
      <button class="factory-tool-btn active" data-factory-shift="R" title="Rano (R)">R</button>
      <button class="factory-tool-btn" data-factory-shift="P" title="Popołudnie (P)">P</button>
      <button class="factory-tool-btn" data-factory-shift="N" title="Noc (N)">N</button>
      <button class="factory-tool-btn" data-factory-shift="W" title="Wolne (W)">W</button>
    </div>
    <button type="button" id="factoryEditorPublishBtn" class="factory-publish-btn" title="Publish">📤</button>
    <button id="factoryEditorExitBtn" title="Zakończ edycję">✕</button>
  </div>

  <!-- APP PANEL (full-screen shell panel, v4.0.0) -->
  <div class="app-panel-overlay" id="appPanelOverlay"></div>
  <section class="app-panel" id="appPanel" role="dialog" aria-modal="true"
    aria-labelledby="appPanelTitle" tabindex="-1">
    <header class="app-panel-header">
      <button type="button" class="app-panel-nav" id="appPanelBackBtn" aria-label="Back">←</button>
      <h2 class="app-panel-title" id="appPanelTitle"></h2>
      <button type="button" class="app-panel-close" id="appPanelCloseBtn" aria-label="Close">×</button>
    </header>
    <div class="app-panel-body" id="appPanelBody"></div>
  </section>

  <!-- ACTION SHEET (v4.0.0) -->
  <div class="action-sheet-overlay" id="actionSheetOverlay"></div>
  <section class="action-sheet" id="actionSheet" role="dialog" aria-modal="true"
    aria-labelledby="actionSheetTitle" tabindex="-1">
    <header class="action-sheet-header">
      <h2 class="action-sheet-title" id="actionSheetTitle"></h2>
      <button type="button" class="action-sheet-close" id="actionSheetCloseBtn" aria-label="Close">×</button>
    </header>
    <div class="action-sheet-body" id="actionSheetBody"></div>
  </section>

  <!-- MOBILE BOTTOM NAV (≤700px; synced with desktop primary nav) -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Views">
    <button type="button" class="mobile-nav-btn" data-view="dashboard">
      <span class="mnb-icon">🏠</span>
      <span class="mnb-label" data-i18n="viewDashboardShort">Pulpit</span>
    </button>
    <button type="button" class="mobile-nav-btn" data-view="month">
      <span class="mnb-icon">📅</span>
      <span class="mnb-label" data-i18n="viewMonthShort">Miesiąc</span>
    </button>
    <button type="button" class="mobile-nav-btn" data-view="table">
      <span class="mnb-icon">📋</span>
      <span class="mnb-label" data-i18n="viewTableShort">Tabela</span>
    </button>
  </nav>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- MODAL (uniwersalny) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle" data-i18n="ok">Tytuł</h3>
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- MODAL NADGODZIN -->
  <div class="modal-overlay" id="otOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="otTitle" data-i18n="otTitle">Nadgodziny</h3>
        <button class="modal-close" id="otClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div id="otContext"
          style="padding:10px 14px; background:var(--bg-cell); border-radius:10px; margin-bottom:15px; font-size:13px;">
        </div>

        <div style="margin-bottom:12px;">
          <label style="font-weight:600; font-size:13px; color:var(--text-muted); display:block; margin-bottom:8px;"
            data-i18n="otHoursLabel">Ile godzin?</label>
          <div class="ot-quick-buttons" id="otQuickBtns">
            <button type="button" class="ot-qbtn" data-h="1">1h</button>
            <button type="button" class="ot-qbtn" data-h="2">2h</button>
            <button type="button" class="ot-qbtn" data-h="3">3h</button>
            <button type="button" class="ot-qbtn" data-h="4">4h</button>
            <button type="button" class="ot-qbtn" data-h="5">5h</button>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;">
            <label style="font-size:13px; color:var(--text-muted);" data-i18n="otOrCustom">lub własnie:</label>
            <input type="number" id="otCustomHoursH" min="0" max="5" step="1" inputmode="numeric"
              aria-label="Hours"
              style="width:64px; padding:6px 8px; border:1px solid var(--border-cell); border-radius:6px; background:var(--bg-container); color:var(--text-main); font-size:14px;">
            <span style="color:var(--text-muted); font-size:13px;" data-i18n="durationHoursUnit">h</span>
            <input type="number" id="otCustomHoursM" min="0" max="59" step="1" inputmode="numeric"
              aria-label="Minutes"
              style="width:64px; padding:6px 8px; border:1px solid var(--border-cell); border-radius:6px; background:var(--bg-container); color:var(--text-main); font-size:14px;">
            <span style="color:var(--text-muted); font-size:13px;" data-i18n="durationMinutesUnit">m</span>
          </div>
        </div>

        <div id="otPreview"
          style="padding:12px; background:var(--bg-info); border-radius:10px; margin:12px 0; font-size:13px; display:none;">
        </div>

        <div style="margin-top:12px;">
          <label style="font-weight:600; font-size:13px; color:var(--text-muted); display:block; margin-bottom:4px;"
            data-i18n="otNote">📝 Notatka (opcjonalne)</label>
          <input type="text" id="otNote" class="note-input" data-i18n-placeholder="otNotePlaceholder">
        </div>
      </div>
      <div class="modal-footer" id="otFooter"></div>
    </div>
  </div>

  <!-- ===== MODUŁY JS (rozbito monolit na 9 plików) ===== -->
  <!-- Duration contract (before schedules/UI that format OT) -->
  <script src="js/duration.js"></script>
  <!-- Schedules architecture: core + registry + Gillette schedule -->
  <script src="js/schedules/_core.js"></script>
  <script src="js/schedules/_registry.js"></script>
  <script src="js/schedules/gillette/metadata.js"></script>
  <script src="js/schedules/gillette/2026.js"></script>
  <!-- Remote factory schedule (Cloudflare D1, read-only). Loads BEFORE core.js
       so the cached server schedule can be applied synchronously. -->
  <script src="js/schedules/remote.js"></script>
  <script src="js/personal/sync-tracking.js"></script>
  <script src="js/personal/notes-tracking.js"></script>
  <script src="js/overtime-logic.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/edit.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/smart-popup.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/views.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/i18n/pl.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/uk.js"></script>
  <script src="js/i18n/i18n.js"></script>
  <script src="js/personalization.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/admin-center.js"></script>
  <script src="js/notes-view.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
